apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: calendar-backend
  labels:
    app: mongodb
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
    app.kubernetes.io/component: mongodb
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/part-of: calendar
        app.kubernetes.io/name: calendar-backend
        app.kubernetes.io/component: mongodb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          # WiredTiger sizes its cache from host RAM, not the cgroup limit, so it must be
          # pinned explicitly or the container is OOMKilled on a small memory limit.
          args: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
          # TCP probes instead of mongosh: each mongosh invocation costs ~60-100Mi inside
          # the container cgroup, which was pushing this pod over its memory limit.
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: calendar-mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: calendar-backend
  labels:
    app: mongodb
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: mongodb
