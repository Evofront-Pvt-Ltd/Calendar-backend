apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: calendar-backend
  labels:
    app: mongodb
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
    app.kubernetes.io/component: mongodb
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/part-of: calendar
        app.kubernetes.io/name: calendar-backend
        app.kubernetes.io/component: mongodb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: calendar-mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: calendar-backend
  labels:
    app: mongodb
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: mongodb
