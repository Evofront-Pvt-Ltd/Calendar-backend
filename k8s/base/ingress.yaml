apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendar-backend
  namespace: calendar-backend
  labels:
    app: calendar-backend
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - calendar-api.212.2.249.45.nip.io
      secretName: calendar-backend-tls
  rules:
    - host: calendar-api.212.2.249.45.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calendar-backend
                port:
                  number: 80
