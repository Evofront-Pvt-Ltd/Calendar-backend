apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-backend-env
  namespace: calendar-backend
  labels:
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
data:
  ENVIRONMENT: "production"
  MONGODB_URL: "mongodb://mongodb:27017"
  MONGODB_DB: "calendar_booking"
  CORS_ORIGINS: "https://calendar.212.2.249.45.nip.io"
  FRONTEND_URL: "https://calendar.212.2.249.45.nip.io"
  APPLICATION_BASE_URL: "https://calendar.212.2.249.45.nip.io"
  APP_FRONTEND_URL: "https://calendar.212.2.249.45.nip.io"
  ORGANIZATION_ID: "default"
  ORGANIZATION_EMAIL_DOMAIN: "evofront.com"
  EMAIL_ENABLED: "false"
  EMAIL_PROVIDER: "sendgrid"
  NOTIFICATIONS_ENABLED: "true"
  IN_APP_NOTIFICATIONS_ENABLED: "true"
  DEFAULT_PRODUCT_TIMEZONE: "Asia/Kolkata"
  DEFAULT_SUPPORT_START_TIME: "00:00"
  DEFAULT_SUPPORT_END_TIME: "00:00"
  DEFAULT_APPOINTMENT_DURATION_MINUTES: "30"
  PUBLIC_BOOKING_MODE: "instant"
  BOOKING_NOTIFICATION_EMAIL: ""
  BOOKING_FROM_NAME: "Calendar Booking"
  BOOKING_REPLY_TO_ENABLED: "true"
  SENDGRID_EMAIL_ENABLED: "false"
  SENDGRID_MAIL_SEND_URL: "https://api.sendgrid.com/v3/mail/send"
  SENDGRID_FROM_EMAIL: ""
  SENDGRID_FROM_NAME: "Calendar Booking"
  SENDGRID_REPLY_TO_EMAIL: ""
  SENDGRID_TEMPLATE_ID: ""
  SENDGRID_VERIFICATION_TEMPLATE_ID: ""
  SENDGRID_PASSWORD_RESET_TEMPLATE_ID: ""
  SENDGRID_MEETING_INVITATION_TEMPLATE_ID: ""
  SENDGRID_BOOKING_TEMPLATE_ID: ""
  SENDGRID_CANCELLATION_TEMPLATE_ID: ""
  SENDGRID_REMINDER_TEMPLATE_ID: ""
  SENDGRID_SANDBOX_MODE: "false"
  SENDGRID_TIMEOUT_SECONDS: "15"
  SENDGRID_MAX_SEND_ATTEMPTS: "2"
  SENDGRID_EVENT_WEBHOOK_ENABLED: "false"
  GOOGLE_CALENDAR_ENABLED: "false"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_REDIRECT_URI: "https://calendar-api.212.2.249.45.nip.io/api/integrations/google/callback"
  GOOGLE_CALENDAR_SCOPES: "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.freebusy"
  GOOGLE_CALENDAR_ID: "primary"
  GOOGLE_OAUTH_STATE_TTL_MINUTES: "10"
  GOOGLE_API_TIMEOUT_SECONDS: "15"
  GOOGLE_MEET_LINK_RETRY_ATTEMPTS: "3"
  GOOGLE_MEET_LINK_RETRY_DELAY_SECONDS: "0.5"
