apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-backend
  namespace: calendar-backend
  labels:
    app: calendar-backend
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: calendar-backend
  template:
    metadata:
      labels:
        app: calendar-backend
        app.kubernetes.io/part-of: calendar
        app.kubernetes.io/name: calendar-backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerhub-pull
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              until nc -z mongodb 27017; do
                echo "waiting for mongodb..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: calendar-backend
          image: calendar-backend:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: calendar-backend-env
            - secretRef:
                name: calendar-backend-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 384Mi
