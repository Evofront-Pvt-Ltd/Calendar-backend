apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendar-registry
  namespace: calendar
  labels:
    app: calendar-registry
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-registry
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - calendar-registry.212.2.249.45.nip.io
      secretName: calendar-registry-tls
  rules:
    - host: calendar-registry.212.2.249.45.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calendar-registry
                port:
                  number: 5000
