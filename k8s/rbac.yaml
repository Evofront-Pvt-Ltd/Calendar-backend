apiVersion: v1
kind: ServiceAccount
metadata:
  name: calendar-cicd
  namespace: calendar-backend
  labels:
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: calendar-backend-deploy
  namespace: calendar-backend
  labels:
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - events
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: calendar-backend-deploy
  namespace: calendar-backend
  labels:
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
subjects:
  - kind: ServiceAccount
    name: calendar-cicd
    namespace: calendar-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: calendar-backend-deploy
