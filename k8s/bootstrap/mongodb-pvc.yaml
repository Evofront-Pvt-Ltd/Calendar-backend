apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calendar-mongodb-data
  namespace: calendar-backend
  labels:
    app: mongodb
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-backend
    app.kubernetes.io/component: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
