apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calendar-mongodb-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: calendar
    app.kubernetes.io/name: calendar-mongodb
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Evofront-Pvt-Ltd/Calendar-backend.git
    targetRevision: develop
    path: k8s/overlays/staging/calendar-mongodb-legacy
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
