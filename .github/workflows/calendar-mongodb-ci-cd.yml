name: Calendar MongoDB CI/CD
on:
  push: { branches: [develop], paths: &p [k8s/services/calendar-mongodb/**, k8s/services/calendar-mongodb-legacy/**, k8s/overlays/staging/calendar-mongodb/**, k8s/overlays/staging/calendar-mongodb-legacy/**, k8s/bootstrap/mongodb-pvc*.yaml, ci-cd/scripts/deploy_mongodb.sh, ci-cd/scripts/ensure_mongodb_pvc.sh, ci-cd/scripts/detect_mongodb_mode.sh, .github/workflows/calendar-mongodb-ci-cd.yml] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: calendar-mongodb-${{ github.ref }}, cancel-in-progress: false }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: bash ci-cd/scripts/deploy_mongodb.sh
