name: Calendar Backend CI/CD
on:
  push:
    branches: [develop]
    paths: &paths [app/**, tests/**, requirements.txt, Dockerfile, .dockerignore, ci-cd/**, k8s/**, .github/workflows/calendar-backend-ci-cd.yml]
  pull_request:
    branches: [develop]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-backend-${{ github.ref }}
  cancel-in-progress: false
env:
  API_URL: https://calendar-api.212.2.249.45.nip.io
  API_HEALTH_URL: https://calendar-api.212.2.249.45.nip.io/health
  APP_URL: https://calendar.212.2.249.45.nip.io
  APP_HEALTH_URL: https://calendar.212.2.249.45.nip.io/
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: calendar-backend
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
      - run: bash ci-cd/scripts/validate_container.sh "${IMAGE_NAME}:${GITHUB_SHA}"
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
      CALENDAR_JWT_SECRET: ${{ secrets.CALENDAR_JWT_SECRET }}
      CALENDAR_SENDGRID_API_KEY: ${{ secrets.CALENDAR_SENDGRID_API_KEY }}
      CALENDAR_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ secrets.CALENDAR_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.CALENDAR_GOOGLE_CLIENT_SECRET }}
      CALENDAR_GOOGLE_TOKEN_ENCRYPTION_KEY: ${{ secrets.CALENDAR_GOOGLE_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: bash ci-cd/scripts/deploy.sh
  urls:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print deployment URLs
        run: |
          INGRESS_IP="$(printf '%s\n' "${APP_URL#https://}" | sed -E 's/^[^.]+\.([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\.nip\.io.*/\1/')"
          echo "========================================"
          echo "DEPLOYMENT COMPLETED"
          echo "========================================"
          echo ""
          echo "Application URL:"
          echo "${APP_URL}"
          echo ""
          echo "API URL:"
          echo "${API_URL}"
          echo ""
          echo "Ingress IP:"
          echo "${INGRESS_IP}"
          echo ""
          echo "========================================"
