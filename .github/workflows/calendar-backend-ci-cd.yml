name: Calendar Backend CI/CD
on:
  push:
    branches: [develop]
    paths: &paths [app/**, tests/**, requirements.txt, Dockerfile, .dockerignore, ci-cd/**, k8s/**, .github/workflows/calendar-backend-ci-cd.yml]
  pull_request:
    branches: [develop]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-backend-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: calendar-backend
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
      - run: bash ci-cd/scripts/validate_container.sh "${IMAGE_NAME}:${GITHUB_SHA}"
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_ACTOR_ID: ${{ github.actor_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: bash ci-cd/scripts/deploy.sh
