name: Calendar Backend CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "ci-cd/**"
      - "k8s/**"
      - ".github/workflows/calendar-backend-ci-cd.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "ci-cd/**"
      - "k8s/**"
      - ".github/workflows/calendar-backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: calendar-backend
  BACKEND_URL: https://calendar-api.212.2.249.45.nip.io

jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python version
        run: |
          set -euo pipefail
          python --version
          python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else f'Expected Python 3.12 from Dockerfile, got {sys.version}')"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: |
          set -euo pipefail
          echo "No lint tool is declared in the backend repository. Skipping lint."

      - name: Unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Build container image
        run: |
          set -euo pipefail
          docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Validate container
        run: |
          set -euo pipefail
          if docker ps -a --format '{{.Names}}' | grep -qx calendar-mongo-validate; then
            docker rm -f calendar-mongo-validate
          fi
          if docker ps -a --format '{{.Names}}' | grep -qx calendar-backend-validate; then
            docker rm -f calendar-backend-validate
          fi
          if docker network ls --format '{{.Name}}' | grep -qx calendar-validate; then
            docker network rm calendar-validate
          fi
          docker network create calendar-validate
          docker run -d --name calendar-mongo-validate --network calendar-validate mongo:7
          set +e
          mongo_ready=0
          for i in $(seq 1 30); do
            if docker exec calendar-mongo-validate mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'; then
              mongo_ready=1
              break
            fi
            sleep 2
          done
          set -e
          if [ "${mongo_ready}" != "1" ]; then
            echo "::error::MongoDB sidecar used for container validation did not become ready"
            docker logs calendar-mongo-validate
            docker rm -f calendar-mongo-validate
            docker network rm calendar-validate
            exit 1
          fi
          docker run -d --name calendar-backend-validate --network calendar-validate -p 127.0.0.1:8000:8000 \
            -e MONGODB_URL=mongodb://calendar-mongo-validate:27017 \
            -e MONGODB_DB=calendar_booking \
            -e JWT_SECRET=ci-container-validation-not-for-production \
            -e ENVIRONMENT=ci \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          set +e
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 3
          done
          set -e
          if [ "${ready}" != "1" ]; then
            echo "::error::Backend container did not serve GET /health"
            docker logs calendar-backend-validate
            docker rm -f calendar-backend-validate calendar-mongo-validate
            docker network rm calendar-validate
            exit 1
          fi
          docker rm -f calendar-backend-validate calendar-mongo-validate
          docker network rm calendar-validate

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_PASSWORD}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD must be configured as repository secrets."
            exit 1
          fi

      - name: Build container image
        run: |
          set -euo pipefail
          docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push immutable image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          REMOTE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REMOTE_TAG}"
          docker push "${REMOTE_TAG}"
          echo "Pushed ${REMOTE_TAG}"

      - name: Update staging manifest image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          python3 ci-cd/scripts/set_deployment_image.py \
            "${DOCKERHUB_USERNAME}/${IMAGE_NAME}" \
            "${GITHUB_SHA}"

      - name: Commit and push GitOps manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --staged --quiet; then
            echo "Manifest image tag already matches ${GITHUB_SHA}"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          git commit -m "deploy: set backend image to ${SHORT_SHA}"
          git push
