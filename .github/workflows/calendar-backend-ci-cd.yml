name: Calendar Backend CI/CD
on:
  push:
    branches: [develop]
    paths: &paths [app/**, tests/**, requirements.txt, Dockerfile, .dockerignore, ci-cd/**, k8s/**, .github/workflows/calendar-backend-ci-cd.yml]
  pull_request:
    branches: [develop]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-backend-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: calendar-backend
  BACKEND_URL: https://calendar-api.212.2.249.45.nip.io
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
      - run: bash ci-cd/scripts/validate_container.sh "${IMAGE_NAME}:${GITHUB_SHA}"
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_ACTOR_ID: ${{ github.actor_id }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
      CALENDAR_JWT_SECRET: ${{ secrets.CALENDAR_JWT_SECRET }}
      CALENDAR_SENDGRID_API_KEY: ${{ secrets.CALENDAR_SENDGRID_API_KEY }}
      CALENDAR_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ secrets.CALENDAR_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.CALENDAR_GOOGLE_CLIENT_SECRET }}
      CALENDAR_GOOGLE_TOKEN_ENCRYPTION_KEY: ${{ secrets.CALENDAR_GOOGLE_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: bash ci-cd/scripts/deploy.sh
      - name: Print application URLs
        env:
          CALENDAR_JWT_SECRET: ${{ secrets.CALENDAR_JWT_SECRET }}
        run: |
          set -euo pipefail
          echo ""
          echo "=============================================="
          echo "Calendar Staging Application URLs"
          echo "=============================================="
          echo "Frontend:  https://calendar.212.2.249.45.nip.io"
          echo "Backend:   ${BACKEND_URL}"
          echo "Health:    ${BACKEND_URL}/health"
          echo "Argo CD:   https://argocd.212.2.249.45.nip.io"
          echo "Image:     ${GITHUB_SHA}"
          echo "=============================================="
          echo "::notice title=Calendar URLs::Frontend https://calendar.212.2.249.45.nip.io | API ${BACKEND_URL} | Health ${BACKEND_URL}/health"
          if [ -z "${CALENDAR_JWT_SECRET}" ]; then
            echo "::warning::CALENDAR_JWT_SECRET is not configured. Add it in GitHub → Settings → Secrets → Actions, then re-run deploy."
          else
            echo "CALENDAR_JWT_SECRET is configured (value not printed)."
          fi
