name: Calendar Backend CI/CD
on:
  push:
    branches: [develop]
    paths: &paths
      - app/**
      - tests/**
      - requirements.txt
      - Dockerfile
      - .dockerignore
      - ci-cd/scripts/deploy_backend.sh
      - ci-cd/scripts/ensure_backend_app_secrets.sh
      - ci-cd/scripts/validate_container.sh
      - ci-cd/scripts/verify_https_health.sh
      - k8s/services/calendar-backend/**
      - k8s/overlays/staging/calendar-backend/**
      - k8s/overlays/staging/kustomization.yaml
      - k8s/argocd/application.yaml
      - ci-cd/scripts/ensure_argocd_application.sh
      - .github/workflows/calendar-backend-ci-cd.yml
  pull_request:
    branches: [develop]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-backend-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_HEALTH_URL: https://calendar-api.212.2.249.45.nip.io/health
  APP_URL: https://calendar.212.2.249.45.nip.io
  APP_HEALTH_URL: https://calendar.212.2.249.45.nip.io/
  IMAGE_NAME: calendar-backend
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
      - run: bash ci-cd/scripts/validate_container.sh "${IMAGE_NAME}:${GITHUB_SHA}"
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
      CALENDAR_JWT_SECRET: ${{ secrets.CALENDAR_JWT_SECRET }}
      CALENDAR_SENDGRID_API_KEY: ${{ secrets.CALENDAR_SENDGRID_API_KEY }}
      CALENDAR_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ secrets.CALENDAR_SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.CALENDAR_GOOGLE_CLIENT_SECRET }}
      CALENDAR_GOOGLE_TOKEN_ENCRYPTION_KEY: ${{ secrets.CALENDAR_GOOGLE_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - run: bash ci-cd/scripts/deploy_backend.sh
