name: calendar-booking

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - calendar_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 20s

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: docker
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: calendar_booking
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random value of at least 32 characters}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:3000
      APPLICATION_BASE_URL: ${APPLICATION_BASE_URL:-http://127.0.0.1:3000}
      ORGANIZATION_ID: ${ORGANIZATION_ID:-default}
      ORGANIZATION_EMAIL_DOMAIN: ${ORGANIZATION_EMAIL_DOMAIN:-evofront.com}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sendgrid}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      IN_APP_NOTIFICATIONS_ENABLED: ${IN_APP_NOTIFICATIONS_ENABLED:-true}
      DEFAULT_PRODUCT_TIMEZONE: ${DEFAULT_PRODUCT_TIMEZONE:-Asia/Kolkata}
      DEFAULT_SUPPORT_START_TIME: ${DEFAULT_SUPPORT_START_TIME:-00:00}
      DEFAULT_SUPPORT_END_TIME: ${DEFAULT_SUPPORT_END_TIME:-00:00}
      DEFAULT_APPOINTMENT_DURATION_MINUTES: ${DEFAULT_APPOINTMENT_DURATION_MINUTES:-30}
      PUBLIC_BOOKING_MODE: ${PUBLIC_BOOKING_MODE:-instant}
      BOOKING_NOTIFICATION_EMAIL: ${BOOKING_NOTIFICATION_EMAIL:-}
      BOOKING_FROM_NAME: ${BOOKING_FROM_NAME:-Calendar Booking}
      BOOKING_REPLY_TO_ENABLED: ${BOOKING_REPLY_TO_ENABLED:-true}
      SENDGRID_EMAIL_ENABLED: ${SENDGRID_EMAIL_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_MAIL_SEND_URL: ${SENDGRID_MAIL_SEND_URL:-https://api.sendgrid.com/v3/mail/send}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Calendar Booking}
      SENDGRID_REPLY_TO_EMAIL: ${SENDGRID_REPLY_TO_EMAIL:-}
      SENDGRID_TEMPLATE_ID: ${SENDGRID_TEMPLATE_ID:-}
      SENDGRID_VERIFICATION_TEMPLATE_ID: ${SENDGRID_VERIFICATION_TEMPLATE_ID:-}
      SENDGRID_PASSWORD_RESET_TEMPLATE_ID: ${SENDGRID_PASSWORD_RESET_TEMPLATE_ID:-}
      SENDGRID_MEETING_INVITATION_TEMPLATE_ID: ${SENDGRID_MEETING_INVITATION_TEMPLATE_ID:-}
      SENDGRID_BOOKING_TEMPLATE_ID: ${SENDGRID_BOOKING_TEMPLATE_ID:-}
      SENDGRID_CANCELLATION_TEMPLATE_ID: ${SENDGRID_CANCELLATION_TEMPLATE_ID:-}
      SENDGRID_REMINDER_TEMPLATE_ID: ${SENDGRID_REMINDER_TEMPLATE_ID:-}
      SENDGRID_SANDBOX_MODE: ${SENDGRID_SANDBOX_MODE:-false}
      SENDGRID_TIMEOUT_SECONDS: ${SENDGRID_TIMEOUT_SECONDS:-15}
      SENDGRID_MAX_SEND_ATTEMPTS: ${SENDGRID_MAX_SEND_ATTEMPTS:-2}
      SENDGRID_EVENT_WEBHOOK_ENABLED: ${SENDGRID_EVENT_WEBHOOK_ENABLED:-false}
      SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY:-}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/integrations/google/callback}
      GOOGLE_CALENDAR_SCOPES: ${GOOGLE_CALENDAR_SCOPES:-https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.freebusy}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_STATE_TTL_MINUTES: ${GOOGLE_OAUTH_STATE_TTL_MINUTES:-10}
      GOOGLE_API_TIMEOUT_SECONDS: ${GOOGLE_API_TIMEOUT_SECONDS:-15}
      GOOGLE_MEET_LINK_RETRY_ATTEMPTS: ${GOOGLE_MEET_LINK_RETRY_ATTEMPTS:-3}
      GOOGLE_MEET_LINK_RETRY_DELAY_SECONDS: ${GOOGLE_MEET_LINK_RETRY_DELAY_SECONDS:-0.5}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      # MSG91 email settings are parked for future reactivation.
      # MSG91_EMAIL_ENABLED: ${MSG91_EMAIL_ENABLED:-false}
      # MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      # MSG91_EMAIL_API_URL: ${MSG91_EMAIL_API_URL:-https://control.msg91.com/api/v5/email/send}
      # MSG91_EMAIL_DOMAIN: ${MSG91_EMAIL_DOMAIN:-}
      # MSG91_FROM_EMAIL: ${MSG91_FROM_EMAIL:-}
      # MSG91_FROM_NAME: ${MSG91_FROM_NAME:-Calendar Booking}
      # MSG91_REPLY_TO_EMAIL: ${MSG91_REPLY_TO_EMAIL:-}
      # MSG91_EMAIL_VERIFICATION_TEMPLATE_ID: ${MSG91_EMAIL_VERIFICATION_TEMPLATE_ID:-}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ../Calendar-Frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
        NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN: ${ORGANIZATION_EMAIL_DOMAIN:-evofront.com}
        NEXT_PUBLIC_LANDING_WIDGET_ID: ${NEXT_PUBLIC_LANDING_WIDGET_ID:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
      NEXT_PUBLIC_ORGANIZATION_EMAIL_DOMAIN: ${ORGANIZATION_EMAIL_DOMAIN:-evofront.com}
      NEXT_PUBLIC_LANDING_WIDGET_ID: ${NEXT_PUBLIC_LANDING_WIDGET_ID:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  calendar_mongo_data:
